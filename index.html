<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vivian · Bầu trời của Vân</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2386bdfc'/%3E%3Cstop offset='1' stop-color='%23f5b8d2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath fill='%23fff' d='M20 46c-6 0-10-4-10-9s4-9 9-9c1-6 7-10 13-10 6 0 11 4 12 9h1c5 0 9 4 9 9.5S50 46 45 46z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Bầu trời: gradient + mặt trời/trăng + sao + mây trôi -->
  <div class="sky" aria-hidden="true">
    <div class="orb"></div>
    <div class="stars" id="stars"></div>
    <div class="clouds" id="clouds"></div>
    <div class="haze"></div>
  </div>

  <div class="app">
    <aside class="sidebar glass">
      <a class="brand" href="#/dashboard" aria-label="Vivian">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-text">
          <b>Vivian</b>
          <small>bầu trời của Vân</small>
        </span>
      </a>

      <div class="nav-label">Không gian</div>
      <nav class="nav" id="nav"></nav>

      <div class="side-bottom">
        <nav class="nav" id="nav2"></nav>
        <div class="quick">
          <div class="nav-label quick-label">Ghi nhanh <button type="button" class="link-btn" id="quick-save">Lưu ↵</button></div>
          <textarea id="quick-note" class="field" rows="3" placeholder="Đang nghĩ gì? Gõ ở đây… (Ctrl + Enter để lưu)"></textarea>
        </div>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
